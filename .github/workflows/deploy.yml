name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# a second merge mid-deploy would race the asset upload
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22

      # the flake pins hugo, so CI builds what `nix build` builds locally
      - run: nix build
      - run: cp -rL result public

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.93.0"
