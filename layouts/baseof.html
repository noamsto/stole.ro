<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
{{ $title := cond .IsHome site.Title (printf "%s · %s" .Title site.Title) }}
{{ $desc := cond (ne .Description "") .Description site.Params.description }}
<meta property="og:type" content="{{ cond .IsHome "website" "article" }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "og.png" | absURL }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site.Title }} — {{ site.Params.description }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1117'/%3E%3Crect x='5.8' y='5.8' width='8.4' height='20.4' fill='%239d8ff0'/%3E%3Crect x='15.5' y='5.8' width='10.7' height='9.6' fill='%23646f94'/%3E%3Crect x='15.5' y='16.6' width='10.7' height='9.6' fill='%23646f94'/%3E%3C/svg%3E">
{{ partial "style.html" . }}
</head>
<body>
{{ block "main" . }}{{ end }}
</body>
</html>
