name = "stole-ro"
compatibility_date = "2026-08-03"

# Assets-only Worker: no `main`, so no `binding` either — that is only valid
# alongside a Worker script.
[assets]
directory = "./public"
not_found_handling = "404-page"

# Creates the custom domain and its DNS record on deploy, so noam.stole.ro
# needs no dashboard step. Requires the hostname to have no existing CNAME.
[[routes]]
pattern = "noam.stole.ro"
custom_domain = true
